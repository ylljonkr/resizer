# Builds the Android APK and the Windows zip, then attaches both to a GitHub Release.
# Runs when you push a tag that starts with "v", for example: git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab for test builds (no Release made)

permissions:
  contents: write   # needed to create the Release

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # also fetch tags, so test builds can find the latest version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Work out version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"                    # v1.2.3 -> 1.2.3
            IFS=. read -r MA MI PA <<< "${V%%-*}"
          else
            # Manual test build: next patch after the latest tag (v1.0.0 -> 1.0.1-test),
            # so it can install over the version already on your phone.
            LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
            IFS=. read -r MA MI PA <<< "${LAST#v}"
            PA=$(( ${PA:-0} + 1 ))
            V="${MA}.${MI}.${PA}-test"
          fi
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))   # 1.2.3 -> 10203
          if (( CODE < 1 )); then CODE=1; fi                       # Android needs a positive number
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Copy www/ into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PappVersionName=${{ steps.ver.outputs.name }} -PappVersionCode=${{ steps.ver.outputs.code }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Resizer-${{ steps.ver.outputs.name }}-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Resizer-*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build Windows zip
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-test"; fi
          npx electron-builder --win zip --x64 --publish never -c.extraMetadata.version="$V"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')   # only tags make a Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
